name: Test

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CODE_SIGNING_REQUIRED: NO
  CODE_SIGN_IDENTITY: ""

jobs:
  build:
    name: Build
    runs-on: blacksmith-6vcpu-macos-latest
    strategy:
      fail-fast: false
      matrix:
        platform:
          [
            "generic/platform=iOS Simulator",
            "platform=macOS",
            "generic/platform=tvOS Simulator",
          ]
    steps:
      - name: Checkout
        uses: actions/checkout@main

      - name: Run Build ${{ matrix.platform }}
        run: |
          cd .swiftpm/xcode
          xcodebuild build \
            -destination "${{ matrix.platform }}" \
            -workspace package.xcworkspace \
            -scheme StatsigOnDeviceEvaluations \
            | xcbeautify && exit ${PIPESTATUS[0]}

  test:
    name: Test
    runs-on: blacksmith-6vcpu-macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@main

      - name: Lint Podspec
        run: pod lib lint StatsigOnDeviceEvaluations.podspec --skip-tests

      - name: Prepare Simulator
        id: simulator
        uses: statsig-io/ios-client-sdk/.github/actions/prepare-simulator@1fde556fbc6ca3b4e7c674f1e273cad8218c22a6

      - name: Run Tests
        env:
          TEST_DESTINATION: ${{ steps.simulator.outputs.destination }}
        run: ./run_tests.sh
